<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Employee Management Studio - SAP Fiori</title>
  
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{
      "employee.management.ui": "./"
    }'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-preload="async"
    data-sap-ui-frameOptions="trusted">
  </script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--sapFontFamily, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      background-color: var(--sapBackgroundColor, #f5f6f7);
    }

    #content {
      height: 100%;
      width: 100%;
    }
  </style>

  <script>
    sap.ui.getCore().attachInit(function() {
      sap.ui.require([
        "sap/ui/core/ComponentContainer"
      ], function(ComponentContainer) {
        new ComponentContainer({
          name: "employee.management.ui",
          settings: {
            id: "employee-management-app"
          },
          async: true,
          height: "100%",
          width: "100%"
        }).placeAt("content");
      });
    });
  </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
