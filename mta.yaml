_schema-version: '3.1'
ID: employee-management
version: 1.0.0
description: "SAP BTP CAPM Employee Management Application"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --------------------- SERVER MODULE (CAP BACKEND) ---------------------
  - name: employee-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    requires:
      - name: employee-management-db
      - name: employee-management-auth

  # --------------------- DB DEPLOYER MODULE (HANA DB) --------------------
  - name: employee-management-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: employee-management-db

resources:
  # --------------------- SAP HANA DATABASE SERVICE ----------------------
  - name: employee-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # --------------------- XSUAA SECURITY SERVICE -------------------------
  - name: employee-management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: employee-management-${space}
        tenant-mode: dedicated
