_schema-version: '3.1'
ID: employee-management
version: 1.0.0
description: "SAP BTP CAPM Employee Management Application"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --------------------- SERVER MODULE (CAP BACKEND & UI) ---------------------
  - name: employee-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    requires:
      - name: employee-management-auth

resources:
  # --------------------- XSUAA SECURITY SERVICE -------------------------
  - name: employee-management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: employee-management-${space}
        tenant-mode: dedicated
