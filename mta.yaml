_schema-version: "3.1"
ID: employee-management
version: 1.0.0
description: SAP BTP CAP Employee Management Application

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  ###########################################################################
  # CAP SERVICE
  ###########################################################################
  - name: employee-management-srv
    type: nodejs
    path: gen/srv

    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M

    build-parameters:
      builder: npm

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: employee-management-auth
      - name: employee-management-db

  ###########################################################################
  # DATABASE DEPLOYER
  ###########################################################################
  - name: employee-management-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack
      memory: 256M

    requires:
      - name: employee-management-db

resources:
  ###########################################################################
  # HDI CONTAINER
  ###########################################################################
  - name: employee-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  ###########################################################################
  # XSUAA
  ###########################################################################
  - name: employee-management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: employee-management-${space}
        tenant-mode: dedicated